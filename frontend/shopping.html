<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping</title>
  <style>
    :root {
      --bg: #0f1420; --card: #1d2637; --card-2: #243049; --text: #eef2f8;
      --muted: #9aa7bd; --accent: #4f9cff; --danger: #ff6b6b; --border: #2b3750;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 5; background: var(--bg);
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
    .top-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
    header h1 { font-size: 19px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who { font-size: 13px; color: var(--muted); text-align: right; flex: 0 0 auto; }
    .who a { color: var(--muted); }
    main { padding: 14px 16px 40px; max-width: 560px; margin: 0 auto; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 10px; cursor: pointer; }
    .row:active { border-color: var(--accent); }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px;
      padding: 2px 9px; min-width: 22px; text-align: center; }
    input[type=text] { background: var(--card-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 12px 14px; font-size: 16px; width: 100%; min-height: 44px; }
    .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
      padding: 12px 16px; font-size: 15px; min-height: 44px; cursor: pointer; }
    .btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .btn-icon { padding: 10px 14px; font-size: 18px; line-height: 1; }
    .add-row { display: flex; gap: 8px; margin: 14px 0; }
    .add-row input { flex: 1; }
    .item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
    .item input[type=checkbox] { width: 22px; height: 22px; flex: 0 0 auto; }
    .item.checked .item-text { text-decoration: line-through; color: var(--muted); }
    .item-text { flex: 1; min-width: 0; word-break: break-word; }
    .item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="top-actions">
      <button id="back" class="btn btn-ghost btn-icon" hidden aria-label="Back">←</button>
      <h1 id="title">Shopping</h1>
    </div>
    <div class="who">
      <span id="who-name"></span><br /><a href="/auth/logout">Sign out</a>
    </div>
  </header>
  <main>
    <section id="view-lists">
      <div id="lists"></div>
      <div class="add-row">
        <input id="new-list-name" type="text" placeholder="New list name…" />
        <button id="add-list" class="btn">Add</button>
      </div>
    </section>
    <section id="view-items" hidden>
      <div id="items"></div>
      <div class="add-row">
        <input id="new-item-text" type="text" placeholder="Add an item…" />
        <button id="add-item" class="btn">Add</button>
      </div>
      <button id="clear-checked" class="btn btn-ghost">Clear checked</button>
    </section>
  </main>
  <script type="module" src="/js/shopping.js"></script>
</body>
</html>
